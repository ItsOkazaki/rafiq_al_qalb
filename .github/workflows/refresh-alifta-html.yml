name: Refresh Al-Ifta HTML corpus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ingest official Al-Ifta HTML
        run: npm run alifta:ingest

      - name: Verify corpus
        run: npm run alifta:verify

      - name: Commit generated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/corpus/generated/alifta-html-chunks.ts src/lib/corpus/generated/alifta-html-chunks.json src/lib/corpus/generated/alifta-html-ledger.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
          else
            git commit -m "chore: refresh Al-Ifta HTML corpus"
            git push
          fi
